version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ccr-postgres
    environment:
      POSTGRES_USER: ccr_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ccr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
